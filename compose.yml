services:
    backend:
        build:
            context: .
            dockerfile: Dockerfile-backend
        container_name: backend
        environment:
            - DB_HOST=db
            - PORT=50001
            - DATABASE=user_management
            - DB_USER=root
            - DB_PASSWORD=root
            - RETRY_COUNT=5
            - TIMEOUT=5000
        networks:
            - user-management
        ports:
            - 50001:50001
        depends_on:
            db:
                condition: service_healthy
    db:
        build:
            context: .
            dockerfile: Dockerfile-mysql
        container_name: user-management-db
        environment:
            - MYSQL_ROOT_PASSWORD=root
        networks:
            - user-management
        volumes:
            - ./db:/docker-entrypoint-initdb.d
        ports:
            - 3306:3306
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 5s
            retries: 3
networks:
    user-management:
        name: user-management
